<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'" />
  <title>Lookup</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="shell.css" />
</head>
<body class="shell">
  <header id="shellbar" class="titlebar shellbar">
    <div class="brand"><span class="brand-mark"></span><span class="brand-name">Lookup</span></div>
    <div id="active-conn" class="active-conn"></div>
    <div id="shell-left" class="tb-actions tb-left no-drag"></div>
    <div class="tb-spacer"></div>
    <div id="shell-actions" class="tb-actions no-drag"></div>
    <button id="tb-settings" class="tb-btn tb-settings no-drag" title="Settings"></button>
  </header>
  <aside id="rail" class="rail">
    <div id="conn-tabs" class="rail-list"></div>
    <button id="conn-add" class="rail-add" title="Open a connection (Ctrl+N)"></button>
  </aside>
  <script src="js/util.js"></script>
  <script src="js/shell.js"></script>
</body>
</html>
